<svg viewBox="0 0 1240 900" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK JP', 'Noto Sans', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="930" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#111827">健康管理アプリ インフラ構成図（課題①）</text>
 
  <!-- Internet users -->
  <g>
    <text x="620" y="145" font-size="12" fill="#374151" text-anchor="middle">エンドユーザー</text>
  </g>
  <line x1="620" y1="152" x2="620" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Public zone background -->
  <rect x="30" y="185" width="1180" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="46" y="205" font-size="12" font-weight="600" fill="#1d4ed8">Public Zone（インターネット公開）</text>

  <!-- Front Door -->
  <rect x="470" y="215" width="300" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="240" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Azure Front Door Premium</text>
  <text x="620" y="260" font-size="12" fill="#374151" text-anchor="middle">+ WAF（マネージドルール）</text>
  <text x="620" y="276" font-size="10" fill="#6b7280" text-anchor="middle">prod: Premium / dev: Standard</text>

  <line x1="620" y1="285" x2="620" y2="345" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Container Apps -->
  <rect x="420" y="345" width="400" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="372" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Azure Container Apps（Consumption）</text>
  <text x="620" y="392" font-size="12" fill="#374151" text-anchor="middle">外部Ingress（Front Door限定）/ Managed Identity</text>
  <text x="620" y="410" font-size="10" fill="#6b7280" text-anchor="middle">prod: Zone Redundant環境 / dev: 単一ゾーン</text>

  <!-- Branch arrows from Container Apps -->
  <line x1="500" y1="435" x2="270" y2="500" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="435" x2="620" y2="500" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="435" x2="960" y2="500" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="800" y1="390" x2="1050" y2="390" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- VNet box (private zone) -->
  <rect x="60" y="500" width="380" height="310" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6,4"/>
  <text x="76" y="522" font-size="12" font-weight="600" fill="#374151">VNet（vnet-health-{env}）</text>
  <text x="76" y="537" font-size="10" fill="#6b7280">PostgreSQL閉域化のために配置</text>

  <!-- subnet-containerapps -->
  <rect x="76" y="550" width="150" height="55" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="151" y="572" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">subnet-</text>
  <text x="151" y="586" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">containerapps</text>
  <text x="151" y="598" font-size="9" fill="#6b7280" text-anchor="middle">VNet統合用</text>

  <!-- arrow subnet-containerapps -> subnet-pe -->
  <line x1="226" y1="577" x2="290" y2="577" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- subnet-private-endpoint -->
  <rect x="260" y="550" width="150" height="55" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="335" y="572" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">subnet-</text>
  <text x="335" y="586" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">private-endpoint</text>
  <text x="335" y="598" font-size="9" fill="#6b7280" text-anchor="middle">PE専用</text>

  <line x1="335" y1="605" x2="335" y2="640" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- PostgreSQL PE -->
  <rect x="260" y="640" width="150" height="34" rx="16" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="325" y="661" font-size="11" fill="#5b21b6" text-anchor="middle">Private Endpoint</text>

  <line x1="335" y1="674" x2="335" y2="700" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="260" y="700" width="150" height="95" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="335" y="725" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">PostgreSQL Flexible Server</text>
  <text x="335" y="743" font-size="9" fill="#374151" text-anchor="middle">Public Network Access: 無効</text>
  <text x="335" y="757" font-size="9" fill="#374151" text-anchor="middle">TLS必須</text>
  <text x="335" y="770" font-size="9" fill="#6b7280" text-anchor="middle">prod: Zone Redundant HA</text>
  <text x="335" y="783" font-size="9" fill="#6b7280" text-anchor="middle"> dev: HAなし</text>

  <!-- Private DNS zone note -->
  <rect x="106" y="700" width="90" height="65" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="151" y="722" font-size="9" font-weight="600" fill="#5b21b6" text-anchor="middle">Private</text>
  <text x="151" y="734" font-size="9" font-weight="600" fill="#5b21b6" text-anchor="middle">DNS Zone</text>
  <text x="151" y="748" font-size="8" fill="#6b7280" text-anchor="middle">privatelink.</text>
  <text x="151" y="758" font-size="8" fill="#6b7280" text-anchor="middle">postgres...</text>
  <line x1="196" y1="732" x2="255" y2="700" stroke="#c4b5fd" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Storage Account -->
  <rect x="530" y="500" width="190" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="625" y="528" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Storage Account</text>
  <text x="625" y="546" font-size="10" fill="#374151" text-anchor="middle">Public + アクセスキー無効化</text>
  <text x="625" y="562" font-size="9" fill="#6b7280" text-anchor="middle">prod: ZRS / dev: LRS</text>

  <!-- Key Vault -->
  <rect x="875" y="500" width="190" height="80" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="970" y="528" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Key Vault</text>
  <text x="970" y="546" font-size="10" fill="#374151" text-anchor="middle">Public（RBAC認可のみで防御）</text>
  <text x="970" y="562" font-size="9" fill="#6b7280" text-anchor="middle">Managed Identity経由でアクセス</text>

  <!-- Monitoring zone -->
  <rect x="1000" y="350" width="200" height="135" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1000" y="360" font-size="12" font-weight="600" fill="#15803d">Observability</text>

  <rect x="1050" y="365" width="115" height="50" rx="6" fill="#ffffff" stroke="#22c55e"/>
  <text x="1107" y="386" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">Application</text>
  <text x="1107" y="400" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">Insights</text>

  <line x1="1107" y1="415" x2="1107" y2="435" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="1035" y="435" width="145" height="45" rx="6" fill="#ffffff" stroke="#22c55e"/>
  <text x="1107" y="454" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">Log Analytics</text>
  <text x="1107" y="468" font-size="9" fill="#6b7280" text-anchor="middle">Workspace</text>

  <!-- Legend -->
  <rect x="30" y="830" width="1180" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="46" y="860" font-size="11" font-weight="600" fill="#374151">凡例</text>

  <line x1="46" y1="875" x2="76" y2="875" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="82" y="879" font-size="10" fill="#374151">通信経路（実線）</text>

  <line x1="220" y1="875" x2="250" y2="875" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="256" y="879" font-size="10" fill="#374151">テレメトリ送信（点線）</text>

  <rect x="420" y="866" width="16" height="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="442" y="879" font-size="10" fill="#374151">Public Zone</text>

  <rect x="560" y="866" width="16" height="16" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="3,2"/>
  <text x="582" y="879" font-size="10" fill="#374151">VNet（Private / PE専用）</text>

  <rect x="740" y="866" width="16" height="16" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="762" y="879" font-size="10" fill="#374151">Observability</text>

</svg>
