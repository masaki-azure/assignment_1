name: Terraform Plan (PR時レビュー用)

# TODO: 本workflowはAzure OIDC認証情報が設定されて初めて動作する（現状は動作未確認）。
# ※備考※
# 現在は単独開発であり、GitHub Actionsの仕様上フォークからのPRにはSecretが渡されないため実害はない。
# ただし、将来的に外部コラボレーターを想定する場合は、PRトリガーでのplan実行（要Azure認証）は見直しを検討する。
# セキュリティのベストプラクティスとしては、PR時は認証不要な validate/fmt のみとし、
# plan は merge 後の信頼済み workflow に限定する構成が望ましい。

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_administrator_password: ${{ secrets.DB_ADMIN_PASSWORD }}

      # TODO: plan結果をPRコメントとして投稿するstepは、サードパーティActionの選定・バージョン固定を実装時に確定する
